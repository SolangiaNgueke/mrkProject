<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mes parcelles</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #1f2937; }
    header { background: #1f2d3a; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: #93c5fd; text-decoration: none; font-size: 14px; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.07); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; text-align: left; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
    th { color: #6b7280; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    .ref { font-weight: 600; }
    .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; color: #fff; }
    .doc-link { color: #2563eb; text-decoration: none; font-size: 13px; font-weight: 600; }
    .msg { padding: 40px; text-align: center; color: #6b7280; }
    .msg.err { color: #b91c1c; }

    /* ---------------- Mobile : chaque ligne devient une carte ---------------- */
    @media (max-width: 640px) {
      .wrap { padding: 16px 10px 50px; }
      table, thead, tbody, tr, td, th { display: block; }
      thead { display: none; }                      /* on masque l'en-tête */
      tr { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
           margin-bottom: 12px; padding: 6px 4px; border-bottom: 0; }
      td { border: 0; padding: 8px 14px; display: flex; justify-content: space-between;
           align-items: center; gap: 12px; text-align: right; }
      td::before {
        content: attr(data-label); color: #6b7280; font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: .02em; text-align: left; flex: 0 0 42%;
      }
      td.ref { font-size: 16px; }
      .doc-link { font-size: 15px; }
    }

    /* ---------------- Mobile : chaque ligne devient une carte compacte ---------------- */
    @media (max-width: 620px) {
      header { padding: 14px 16px; }
      header h1 { font-size: 16px; }
      .wrap { padding: 16px 10px 40px; }
      .card { background: transparent; box-shadow: none; }
      table, tbody, tr, td { display: block; width: 100%; box-sizing: border-box; }
      thead { display: none; }
      tr { background: #fff; border-radius: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.07);
           margin-bottom: 12px; padding: 12px 14px; }
      td { border: 0; padding: 2px 0; font-size: 14px; }
      td.ref { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
      td:nth-child(2), td:nth-child(3), td:nth-child(4), td:nth-child(5) {
        display: inline-block; margin-right: 12px; color: #6b7280; font-size: 13px;
      }
      td:last-child { margin-top: 8px; }
      .doc-link { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mes parcelles</h1>
    <a href="index.html">← Carte publique</a>
  </header>

  <div class="wrap">
    <div class="card">
      <div id="msg" class="msg">Chargement…</div>
      <table id="tbl" style="display:none">
        <thead>
          <tr><th>Référence</th><th>Statut</th><th>Fiabilité</th><th>Dimension</th><th>Déclarée le</th><th>Documents</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_ROOT = window.API_ROOT;
    const API = API_ROOT + "parcelles/";
    const token = localStorage.getItem("foncier_token");

    const STATUT_COLORS = {
      draft: "#9ca3af", submitted: "#f59e0b", verifying: "#3b82f6",
      validated: "#22c55e", rejected: "#6b7280", disputed: "#ef4444"
    };

    function setMsg(t, err) {
      const m = document.getElementById("msg");
      m.textContent = t; m.className = "msg" + (err ? " err" : ""); m.style.display = "block";
    }

    function fmtDate(iso) {
      try { return new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }); }
      catch (e) { return iso; }
    }
    function fmtSurface(m2) {
      if (!m2) return "—";
      return `${Math.round(m2)} m² (${(m2/10000).toFixed(2)} ha)`;
    }

    async function load() {
      if (!token) { setMsg("Connectez-vous sur la carte pour voir vos parcelles.", true); return; }
      let res;
      try { res = await fetch(API_ROOT + "parcelles/mine/", { headers: { "Authorization": "Token " + token } }); }
      catch (e) { setMsg("Erreur réseau : " + e, true); return; }
      if (res.status === 401) { setMsg("Session expirée. Reconnectez-vous sur la carte.", true); return; }
      if (!res.ok) { setMsg("Impossible de charger vos parcelles.", true); return; }
      const list = await res.json();
      if (!list.length) { setMsg("Vous n'avez encore déclaré aucune parcelle.", false); return; }

      document.getElementById("rows").innerHTML = list.map(p => {
        const color = STATUT_COLORS[p.status] || "#999";
        return `<tr>
          <td class="ref" data-label="Référence">${p.reference || ("#" + p.id)}</td>
          <td data-label="Statut"><span class="badge" style="background:${color}">${p.status_display}</span></td>
          <td data-label="Fiabilité">${p.reliability_display}</td>
          <td data-label="Dimension">${fmtSurface(p.surface_m2)}</td>
          <td data-label="Déclarée le">${fmtDate(p.created_at)}</td>
          <td data-label="Documents"><a class="doc-link" href="documents.html?parcelle=${p.id}">Gérer les documents →</a></td>
        </tr>`;
      }).join("");

      document.getElementById("msg").style.display = "none";
      document.getElementById("tbl").style.display = "table";
    }

    load();
  </script>
</body>
</html>
